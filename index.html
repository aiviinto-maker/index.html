<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana SPL Token Creator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #090b13;
      color: #f5f7ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
    }

    header {
      text-align: center;
      margin: 20px 0;
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #9945ff, #14f195);
      color: #080a10;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .subtitle,
    .status {
      color: #a9b0c5;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #30384f;
      border-radius: 18px;
      background: #151927;
    }

    .network {
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid rgba(25, 211, 155, 0.4);
      border-radius: 11px;
      background: rgba(25, 211, 155, 0.08);
      color: #19d39b;
      font-weight: bold;
      text-align: center;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #d9dded;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #3a435d;
      border-radius: 10px;
      outline: none;
      background: #1e2437;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #9945ff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #9945ff, #7132c7);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: #2a3044;
    }

    .wallet-box,
    .result-box {
      display: none;
      padding: 13px;
      margin-top: 14px;
      border-radius: 10px;
      background: #1e2437;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      color: #19d39b;
    }

    .error {
      color: #ff6678;
    }

    .warning {
      padding: 14px;
      border: 1px solid rgba(255, 179, 71, 0.3);
      border-radius: 11px;
      background: rgba(255, 179, 71, 0.1);
      color: #ffd28b;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    a {
      color: #b98cff;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">S</div>
      <h1>Solana Token Creator</h1>
      <p class="subtitle">
        Create a basic SPL token using Phantom on Solana Devnet.
      </p>
    </header>

    <section class="card">
      <div class="network">
        Solana Devnet
      </div>

      <h2>Connect Wallet</h2>

      <button id="connectButton">
        Connect Phantom
      </button>

      <button id="disconnectButton" class="secondary hidden">
        Disconnect Wallet
      </button>

      <div id="status" class="status">
        Wallet not connected.
      </div>

      <div id="walletBox" class="wallet-box"></div>
    </section>

    <section class="card">
      <h2>Token Details</h2>

      <label for="tokenName">Token name</label>
      <input
        id="tokenName"
        type="text"
        maxlength="40"
        placeholder="Example Coin"
      />

      <label for="tokenSymbol">Token symbol</label>
      <input
        id="tokenSymbol"
        type="text"
        maxlength="10"
        placeholder="EXM"
      />

      <label for="tokenDecimals">Decimals</label>
      <input
        id="tokenDecimals"
        type="number"
        min="0"
        max="9"
        value="9"
      />

      <label for="tokenSupply">Initial supply</label>
      <input
        id="tokenSupply"
        type="text"
        inputmode="numeric"
        placeholder="1000000"
      />

      <button id="createButton" disabled>
        Create SPL Token
      </button>

      <div id="resultBox" class="result-box"></div>
    </section>

    <section class="card">
      <div class="warning">
        <strong>Security warning:</strong><br />
        Never enter a seed phrase or private key. Phantom must approve every
        transaction. This version works on Devnet only.
      </div>
    </section>

  </main>

  <script type="module">
    import {
      Connection,
      Keypair,
      SystemProgram,
      Transaction
    } from "https://esm.sh/@solana/web3.js@1.98.4";

    import {
      MINT_SIZE,
      TOKEN_PROGRAM_ID,
      ASSOCIATED_TOKEN_PROGRAM_ID,
      getMinimumBalanceForRentExemptMint,
      createInitializeMintInstruction,
      getAssociatedTokenAddress,
      createAssociatedTokenAccountInstruction,
      createMintToInstruction
    } from "https://esm.sh/@solana/spl-token@0.4.9";

    const DEVNET_RPC = "https://api.devnet.solana.com";

    const connection = new Connection(
      DEVNET_RPC,
      "confirmed"
    );

    const connectButton =
      document.getElementById("connectButton");

    const disconnectButton =
      document.getElementById("disconnectButton");

    const createButton =
      document.getElementById("createButton");

    const statusElement =
      document.getElementById("status");

    const walletBox =
      document.getElementById("walletBox");

    const resultBox =
      document.getElementById("resultBox");

    let phantomProvider = null;
    let connectedWallet = null;

    function getPhantomProvider() {
      if (
        window.phantom &&
        window.phantom.solana &&
        window.phantom.solana.isPhantom
      ) {
        return window.phantom.solana;
      }

      if (
        window.solana &&
        window.solana.isPhantom
      ) {
        return window.solana;
      }

      return null;
    }

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = "status";

      if (type === "success") {
        statusElement.classList.add("success");
      }

      if (type === "error") {
        statusElement.classList.add("error");
      }
    }

    function showResult(html, type = "") {
      resultBox.innerHTML = html;
      resultBox.className = "result-box";
      resultBox.style.display = "block";

      if (type === "success") {
        resultBox.classList.add("success");
      }

      if (type === "error") {
        resultBox.classList.add("error");
      }
    }

    function getErrorMessage(error) {
      if (!error) {
        return "Unknown error";
      }

      if (typeof error === "string") {
        return error;
      }

      if (error.message) {
        return error.message;
      }

      if (error.toString) {
        return error.toString();
      }

      return "Unknown error";
    }

    function validateForm() {
      const name =
        document.getElementById("tokenName").value.trim();

      const symbol =
        document.getElementById("tokenSymbol").value.trim();

      const decimalsText =
        document.getElementById("tokenDecimals").value.trim();

      const supply =
        document.getElementById("tokenSupply").value.trim();

      if (!name) {
        throw new Error("Enter a token name.");
      }

      if (name.length > 40) {
        throw new Error(
          "Token name must be 40 characters or fewer."
        );
      }

      if (!symbol) {
        throw new Error("Enter a token symbol.");
      }

      if (!/^[A-Za-z0-9]+$/.test(symbol)) {
        throw new Error(
          "Token symbol can contain only letters and numbers."
        );
      }

      if (symbol.length > 10) {
        throw new Error(
          "Token symbol must be 10 characters or fewer."
        );
      }

      if (!/^[0-9]+$/.test(decimalsText)) {
        throw new Error(
          "Decimals must be a whole number from 0 to 9."
        );
      }

      const decimals = Number(decimalsText);

      if (decimals < 0 || decimals > 9) {
        throw new Error(
          "Decimals must be a whole number from 0 to 9."
        );
      }

      if (!/^[0-9]+$/.test(supply)) {
        throw new Error(
          "Initial supply must be a positive whole number."
        );
      }

      if (BigInt(supply) <= 0n) {
        throw new Error(
          "Initial supply must be greater than zero."
        );
      }

      return {
        name: name,
        symbol: symbol.toUpperCase(),
        decimals: decimals,
        supply: supply
      };
    }

    async function connectWallet() {
      phantomProvider = getPhantomProvider();

      if (!phantomProvider) {
        setStatus(
          "Phantom was not detected. Open this page inside Phantom's in-app browser.",
          "error"
        );
        return;
      }

      try {
        const response =
          await phantomProvider.connect();

        connectedWallet = response.publicKey;

        walletBox.textContent =
          "Connected wallet: " +
          connectedWallet.toString();

        walletBox.style.display = "block";

        connectButton.classList.add("hidden");
        disconnectButton.classList.remove("hidden");
        createButton.disabled = false;

        setStatus(
          "Wallet connected successfully.",
          "success"
        );
      } catch (error) {
        setStatus(
          getErrorMessage(error),
          "error"
        );
      }
    }

    async function disconnectWallet() {
      try {
        if (phantomProvider) {
          await phantomProvider.disconnect();
        }
      } catch (error) {
        console.log("Disconnect error:", error);
      }

      phantomProvider = null;
      connectedWallet = null;

      connectButton.classList.remove("hidden");
      disconnectButton.classList.add("hidden");
      createButton.disabled = true;

      walletBox.textContent = "";
      walletBox.style.display = "none";

      setStatus("Wallet disconnected.");
    }

    async function createToken() {
      if (!phantomProvider || !connectedWallet) {
        throw new Error("Connect Phantom first.");
      }

      const details = validateForm();

      const mintKeypair = Keypair.generate();
      const mintAddress = mintKeypair.publicKey;

      const supplyInBaseUnits =
        BigInt(details.supply) *
        (10n ** BigInt(details.decimals));

      const maximumUint64 =
        18446744073709551615n;

      if (supplyInBaseUnits > maximumUint64) {
        throw new Error(
          "The supply is too large for a Solana token."
        );
      }

      setStatus(
        "Preparing the transaction..."
      );

      const rentLamports =
        await getMinimumBalanceForRentExemptMint(
          connection
        );

      const associatedTokenAddress =
        await getAssociatedTokenAddress(
          mintAddress,
          connectedWallet,
          false,
          TOKEN_PROGRAM_ID,
          ASSOCIATED_TOKEN_PROGRAM_ID
        );

      const transaction =
        new Transaction();

      transaction.add(
        SystemProgram.createAccount({
          fromPubkey: connectedWallet,
          newAccountPubkey: mintAddress,
          space: MINT_SIZE,
          lamports: rentLamports,
          programId: TOKEN_PROGRAM_ID
        })
      );

      transaction.add(
        createInitializeMintInstruction(
          mintAddress,
          details.decimals,
          connectedWallet,
          connectedWallet,
          TOKEN_PROGRAM_ID
        )
      );

      transaction.add(
        createAssociatedTokenAccountInstruction(
          connectedWallet,
          associatedTokenAddress,
          connectedWallet,
          mintAddress,
          TOKEN_PROGRAM_ID,
          ASSOCIATED_TOKEN_PROGRAM_ID
        )
      );

      transaction.add(
        createMintToInstruction(
          mintAddress,
          associatedTokenAddress,
          connectedWallet,
          supplyInBaseUnits,
          [],
          TOKEN_PROGRAM_ID
        )
      );

      const latestBlockhash =
        await connection.getLatestBlockhash(
          "confirmed"
        );

      transaction.feePayer = connectedWallet;
      transaction.recentBlockhash =
        latestBlockhash.blockhash;

      transaction.partialSign(mintKeypair);

      setStatus(
        "Review and approve the transaction in Phantom..."
      );

      const result =
        await phantomProvider.signAndSendTransaction(
          transaction
        );

      const signature =
        typeof result === "string"
          ? result
          : result.signature;

      if (!signature) {
        throw new Error(
          "Phantom did not return a transaction signature."
        );
      }

      setStatus(
        "Transaction submitted. Waiting for confirmation..."
      );

      await connection.confirmTransaction(
        {
          signature: signature,
          blockhash: latestBlockhash.blockhash,
          lastValidBlockHeight:
            latestBlockhash.lastValidBlockHeight
        },
        "confirmed"
      );

      const mintExplorerUrl =
        "https://explorer.solana.com/address/" +
        mintAddress.toString() +
        "?cluster=devnet";

      const transactionExplorerUrl =
        "https://explorer.solana.com/tx/" +
        signature +
        "?cluster=devnet";

      showResult(
        "<strong>Token created successfully.</strong><br><br>" +
        "Name: " + details.name + "<br>" +
        "Symbol: " + details.symbol + "<br>" +
        "Supply: " + details.supply + "<br>" +
        "Decimals: " + details.decimals + "<br><br>" +
        "<strong>Mint address:</strong><br>" +
        mintAddress.toString() +
        "<br><br>" +
        "<a href=\"" +
        mintExplorerUrl +
        "\" target=\"_blank\">View token on Explorer</a>" +
        "<br><br>" +
        "<a href=\"" +
        transactionExplorerUrl +
        "\" target=\"_blank\">View transaction</a>",
        "success"
      );

      setStatus(
        "Token created successfully.",
        "success"
      );
    }

    connectButton.addEventListener(
      "click",
      connectWallet
    );

    disconnectButton.addEventListener(
      "click",
      disconnectWallet
    );

    createButton.addEventListener(
      "click",
      async function () {
        createButton.disabled = true;
        resultBox.style.display = "none";

        try {
          await createToken();
        } catch (error) {
          console.error(error);

          const message =
            getErrorMessage(error);

          showResult(
            "<strong>Token creation failed.</strong><br><br>" +
            message,
            "error"
          );

          setStatus(
            "Token creation failed.",
            "error"
          );
        } finally {
          createButton.disabled = false;
        }
      }
    );

    window.addEventListener(
      "load",
      function () {
        phantomProvider =
          getPhantomProvider();

        if (!phantomProvider) {
          setStatus(
            "Open this website inside Phantom's in-app browser."
          );
        }
      }
    );
  </script>
</body>
  </html>
